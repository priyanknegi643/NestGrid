<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NestGrid</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
</head>

<body>

<!-- top user bar -->
<div id="userNav" style="
position:absolute;top:20px;left:50%;transform:translateX(-50%);
z-index:1001;display:flex;align-items:center;gap:10px;
background:rgba(13,18,28,0.85);
backdrop-filter:blur(20px);
border:1px solid rgba(99,102,241,0.15);
border-radius:20px;padding:8px 16px;
font-family:sans-serif;font-size:13px;color:#E5E7EB;">
  <span id="navUserName">👤 Guest</span>
  <span style="color:#374151">|</span>
  <button onclick="logout()" style="background:none;border:none;color:#6B7280;cursor:pointer;font-size:12px;">Logout</button>
</div>

<!-- sidebar -->
<div class="sidebar">
  <h2>NestGrid</h2>

  <input id="locationInput" placeholder="Enter location">
  <button class="ghost-btn" onclick="useMyLocation()">📍 Use My Location</button>

  <label>Type</label>
  <select id="type">
    <option>PG</option>
    <option>Flat</option>
    <option>Hostel</option>
    <option>Studio</option>
  </select>

  <label>Radius (km)</label>
  <input type="number" id="radius" value="10">

  <label>Weights</label>
  <div>Gym <input type="range" id="wg" min="0" max="10" value="5"></div>
  <div>Hospital <input type="range" id="wh" min="0" max="10" value="3"></div>
  <div>Grocery <input type="range" id="wgr" min="0" max="10" value="2"></div>

  <button class="primary-btn" onclick="runSearch()">Search</button>
</div>

<!-- map + results -->
<div id="map"></div>
<div id="listings"></div>

<!-- compare popup -->
<div id="compareModal" class="modal">
  <div class="modal-content">
    <button class="ghost-btn close-btn" onclick="closeCompare()">✕ Close</button>
    <div id="compareContent"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
