<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NestGrid — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  /* basic theme */
  :root {
    --bg:#080C10;--surface:rgba(13,18,28,0.85);--border:rgba(99,102,241,0.15);
    --border-hover:rgba(99,102,241,0.4);--text:#EEF0F6;--muted:#6B7280;
    --primary:#6366F1;--primary-glow:rgba(99,102,241,0.3);
    --green:#22C55E;--green-glow:rgba(34,197,94,0.25);
    --red:#F43F5E;--amber:#F59E0B;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  body{
    font-family:'DM Sans',sans-serif;
    background:var(--bg);color:var(--text);
    min-height:100vh;display:flex;
    align-items:center;justify-content:center;
    overflow:hidden;position:relative;
  }

  /* background effect */
  .bg-orbs{position:fixed;inset:0;pointer-events:none;z-index:0;}
  .orb{position:absolute;border-radius:50%;filter:blur(80px);animation:drift 12s ease-in-out infinite alternate;}
  .orb-1{width:400px;height:400px;background:rgba(99,102,241,0.12);top:-100px;left:-100px;}
  .orb-2{width:300px;height:300px;background:rgba(34,197,94,0.08);bottom:-80px;right:-80px;animation-delay:4s;}
  .orb-3{width:250px;height:250px;background:rgba(244,63,94,0.06);top:50%;left:50%;animation-delay:8s;}
  @keyframes drift{from{transform:translate(0,0)}to{transform:translate(30px,20px)}}

  .auth-wrapper{position:relative;z-index:10;width:100%;max-width:480px;padding:20px;}
  .auth-card{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:40px;}

  .logo-row{display:flex;align-items:center;gap:12px;margin-bottom:32px;}
  .logo-icon{width:44px;height:44px;background:linear-gradient(135deg,var(--primary),var(--green));border-radius:12px;display:flex;align-items:center;justify-content:center;}
  .logo-text{font-family:'Syne';font-size:22px;font-weight:800;}

  .role-toggle{display:flex;background:rgba(0,0,0,0.3);border:1px solid var(--border);border-radius:12px;padding:4px;margin-bottom:28px;}
  .role-btn{flex:1;padding:9px;border:none;background:transparent;color:var(--muted);cursor:pointer;}
  .role-btn.active{background:rgba(99,102,241,0.25);color:var(--text);}

  .tab-row{display:flex;gap:4px;margin-bottom:28px;border-bottom:1px solid var(--border);}
  .tab-btn{flex:1;padding:10px;background:none;border:none;color:var(--muted);cursor:pointer;}
  .tab-btn.active{color:var(--text);}

  .form-section{display:none;}
  .form-section.active{display:block;}

  .form-group{margin-bottom:16px;}
  .form-input{width:100%;padding:12px;background:rgba(0,0,0,0.35);border:1px solid var(--border);border-radius:12px;color:var(--text);}

  .submit-btn{width:100%;padding:13px;border:none;border-radius:12px;background:var(--primary);color:white;cursor:pointer;}

  .toast{position:fixed;top:20px;right:20px;padding:12px;border-radius:10px;display:none;}
</style>
</head>

<body>

<!-- background visuals -->
<div class="bg-orbs">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>

<div class="auth-wrapper">
  <div class="auth-card">

    <!-- logo -->
    <div class="logo-row">
      <div class="logo-icon">🏠</div>
      <div class="logo-text">NestGrid</div>
    </div>

    <!-- role switch -->
    <div class="role-toggle">
      <button class="role-btn active" onclick="setRole('USER')" id="roleUser">Tenant</button>
      <button class="role-btn" onclick="setRole('OWNER')" id="roleOwner">Owner</button>
    </div>

    <div id="heroText">Welcome</div>

    <!-- tabs -->
    <div class="tab-row">
      <button class="tab-btn active" onclick="setTab('login')" id="tabLogin">Login</button>
      <button class="tab-btn" onclick="setTab('signup')" id="tabSignup">Sign Up</button>
    </div>

    <!-- login form -->
    <div class="form-section active" id="loginForm">
      <div class="form-group">
        <input class="form-input" id="loginEmail" type="email" placeholder="Email">
      </div>
      <div class="form-group">
        <input class="form-input" id="loginPass" type="password" placeholder="Password">
      </div>
      <button class="submit-btn" id="loginBtn" onclick="handleLogin()">Login</button>
    </div>

    <!-- signup form -->
    <div class="form-section" id="signupForm">
      <div class="form-group">
        <input class="form-input" id="signupName" placeholder="Name">
      </div>
      <div class="form-group">
        <input class="form-input" id="signupEmail" placeholder="Email">
      </div>
      <div class="form-group">
        <input class="form-input" id="signupPass" type="password" placeholder="Password">
      </div>
      <button class="submit-btn" id="signupBtn" onclick="handleSignup()">Create Account</button>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// api url
const API='http://localhost:8080/api';

let currentRole='USER';
let currentTab='login';

// switch role
function setRole(role){
 currentRole=role;
 document.getElementById('roleUser').classList.toggle('active',role==='USER');
 document.getElementById('roleOwner').classList.toggle('active',role==='OWNER');
}

// switch tab
function setTab(tab){
 currentTab=tab;
 document.getElementById('loginForm').classList.toggle('active',tab==='login');
 document.getElementById('signupForm').classList.toggle('active',tab==='signup');
}

// show message
function showToast(msg){
 const t=document.getElementById('toast');
 t.textContent=msg;
 t.style.display='block';
 setTimeout(()=>t.style.display='none',3000);
}

// login
async function handleLogin(){
 const email=document.getElementById('loginEmail').value;
 const password=document.getElementById('loginPass').value;
 if(!email||!password)return showToast('Fill all fields');

 const res=await fetch(API+'/auth/login',{
  method:'POST',
  headers:{'Content-Type':'application/json'},
  body:JSON.stringify({email,password})
 });

 if(!res.ok)return showToast('Login failed');
 const data=await res.json();

 sessionStorage.setItem('nestgrid_token',data.token);
 sessionStorage.setItem('nestgrid_user',JSON.stringify(data));

 window.location.href='index.html';
}

// signup
async function handleSignup(){
 const name=document.getElementById('signupName').value;
 const email=document.getElementById('signupEmail').value;
 const password=document.getElementById('signupPass').value;

 if(!name||!email||!password)return showToast('Fill all fields');

 const res=await fetch(API+'/auth/signup',{
  method:'POST',
  headers:{'Content-Type':'application/json'},
  body:JSON.stringify({name,email,password,role:currentRole})
 });

 if(!res.ok)return showToast('Signup failed');
 const data=await res.json();

 sessionStorage.setItem('nestgrid_token',data.token);
 sessionStorage.setItem('nestgrid_user',JSON.stringify(data));

 window.location.href='index.html';
}
</script>
</body>
</html>
