<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NestGrid — Owner Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<style>
  :root {
    --bg: #080C10;
    --surface: rgba(13,18,28,0.9);
    --border: rgba(99,102,241,0.15);
    --border-hover: rgba(99,102,241,0.4);
    --text: #EEF0F6;
    --muted: #6B7280;
    --primary: #6366F1;
    --primary-glow: rgba(99,102,241,0.25);
    --green: #22C55E;
    --amber: #F59E0B;
    --red: #F43F5E;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  body::before {
    content:'';
    position:fixed; inset:0;
    background-image:
      linear-gradient(rgba(99,102,241,0.02) 1px,transparent 1px),
      linear-gradient(90deg,rgba(99,102,241,0.02) 1px,transparent 1px);
    background-size:60px 60px;
    pointer-events:none; z-index:0;
  }

  /* ===== NAV ===== */
  .nav {
    position: relative; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 32px;
    background: rgba(8,12,16,0.8);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
  }
  .nav-logo {
    display: flex; align-items: center; gap: 10px;
  }
  .logo-icon {
    width:36px; height:36px;
    background: linear-gradient(135deg, var(--primary), var(--green));
    border-radius: 10px;
    display:flex; align-items:center; justify-content:center;
    font-size:16px;
  }
  .logo-text {
    font-family:'Syne',sans-serif; font-size:18px; font-weight:800;
    background: linear-gradient(90deg,#fff 40%,var(--primary));
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  }
  .nav-right { display:flex; align-items:center; gap:12px; }
  .nav-user {
    display:flex; align-items:center; gap:8px;
    padding:7px 14px;
    background: rgba(99,102,241,0.1);
    border:1px solid var(--border-hover);
    border-radius:20px; font-size:13px;
  }
  .nav-btn {
    padding:7px 16px;
    background:transparent;
    border:1px solid var(--border);
    border-radius:20px;
    color:var(--muted); font-size:13px; cursor:pointer;
    transition:all 0.2s;
    font-family:'DM Sans',sans-serif;
  }
  .nav-btn:hover { border-color:var(--red); color:var(--red); }

  /* ===== MAIN LAYOUT ===== */
  .main {
    position:relative; z-index:10;
    flex:1; display:flex; gap:0;
  }

  /* ===== SIDEBAR ===== */
  .owner-sidebar {
    width: 380px; min-width:380px;
    background: var(--surface);
    backdrop-filter: blur(20px);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    overflow-y: auto;
    max-height: calc(100vh - 65px);
  }

  .sidebar-tabs {
    display:flex;
    border-bottom: 1px solid var(--border);
    padding: 0 20px;
    position:sticky; top:0; z-index:5;
    background: var(--surface);
    backdrop-filter: blur(20px);
  }
  .stab {
    flex:1; padding:15px 8px;
    background:transparent; border:none;
    color:var(--muted); font-family:'Syne',sans-serif;
    font-size:13px; font-weight:600;
    cursor:pointer; position:relative;
    transition:color 0.2s; letter-spacing:0.3px;
  }
  .stab.active { color:var(--text); }
  .stab::after {
    content:''; position:absolute; bottom:0;left:50%;right:50%;
    height:2px; background:linear-gradient(90deg,var(--primary),var(--green));
    transition:left 0.3s,right 0.3s;
  }
  .stab.active::after { left:0;right:0; }

  .stab-content { display:none; padding:20px; }
  .stab-content.active { display:block; animation:fadeUp 0.3s ease; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

  /* ===== ADD PG FORM ===== */
  .section-title {
    font-family:'Syne',sans-serif; font-size:16px; font-weight:700;
    margin-bottom:16px; letter-spacing:-0.2px;
  }

  .form-group { margin-bottom:14px; }
  .form-label {
    display:block; font-size:11px; color:var(--muted);
    margin-bottom:6px; letter-spacing:0.5px; text-transform:uppercase; font-weight:500;
  }
  .form-input {
    width:100%; padding:10px 12px;
    background:rgba(0,0,0,0.4);
    border:1px solid var(--border); border-radius:10px;
    color:var(--text); font-family:'DM Sans',sans-serif; font-size:13px;
    transition:border-color 0.2s,box-shadow 0.2s; outline:none;
  }
  .form-input:focus {
    border-color:var(--border-hover);
    box-shadow:0 0 0 3px var(--primary-glow);
  }
  .form-input::placeholder { color:var(--muted); }

  .two-col { display:grid; grid-template-columns:1fr 1fr; gap:10px; }

  /* ===== AMENITIES GRID ===== */
  .amenity-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:14px; }
  .amenity-toggle {
    display:flex; flex-direction:column; align-items:center; gap:5px;
    padding:12px 8px;
    background:rgba(0,0,0,0.3);
    border:1px solid var(--border);
    border-radius:12px; cursor:pointer; transition:all 0.2s;
    font-size:12px; color:var(--muted); text-align:center;
    user-select:none;
  }
  .amenity-toggle.selected {
    border-color:var(--border-hover);
    background:rgba(99,102,241,0.1);
    color:var(--text);
  }
  .amenity-toggle .a-icon { font-size:20px; }

  /* ===== LAT/LNG HINT ===== */
  .map-hint {
    display:flex; align-items:center; gap:8px;
    padding:10px 12px;
    background:rgba(34,197,94,0.05);
    border:1px solid rgba(34,197,94,0.15);
    border-radius:10px; font-size:12px; color:var(--green);
    margin-bottom:14px;
  }

  /* ===== SUBMIT BTN ===== */
  .submit-btn {
    width:100%; padding:12px;
    border-radius:12px; border:none;
    background:linear-gradient(135deg,var(--primary),#4F46E5);
    color:white; font-family:'Syne',sans-serif;
    font-size:14px; font-weight:700; cursor:pointer;
    transition:all 0.2s; letter-spacing:0.3px;
    box-shadow:0 8px 24px var(--primary-glow);
  }
  .submit-btn:hover { transform:translateY(-2px); }

  /* ===== MY LISTINGS ===== */
  .listing-card {
    background:rgba(0,0,0,0.3);
    border:1px solid var(--border);
    border-radius:14px; padding:14px;
    margin-bottom:10px; transition:all 0.2s;
  }
  .listing-card:hover { border-color:var(--border-hover); }
  .lc-title { font-family:'Syne',sans-serif; font-size:14px; font-weight:700; margin-bottom:4px; }
  .lc-meta { font-size:12px; color:var(--muted); margin-bottom:8px; }
  .lc-price { color:var(--primary); font-size:13px; font-weight:600; }
  .lc-amenities { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .amenity-pill {
    padding:3px 9px;
    background:rgba(99,102,241,0.1);
    border:1px solid var(--border);
    border-radius:20px; font-size:11px; color:var(--muted);
  }
  .lc-actions { display:flex; gap:6px; margin-top:10px; }
  .action-btn {
    flex:1; padding:7px;
    border-radius:8px; border:1px solid var(--border);
    background:transparent; color:var(--muted);
    font-size:12px; cursor:pointer; transition:all 0.2s;
    font-family:'DM Sans',sans-serif;
  }
  .action-btn.del:hover { border-color:var(--red); color:var(--red); }
  .action-btn.edit:hover { border-color:var(--amber); color:var(--amber); }
  .empty-state {
    text-align:center; padding:40px 20px;
    color:var(--muted); font-size:13px;
  }
  .empty-icon { font-size:36px; margin-bottom:10px; }

  /* ===== MAP ===== */
  #ownerMap { flex:1; min-height:calc(100vh - 65px); }

  /* ===== CROSSHAIR MARKER ===== */
  .map-crosshair {
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%);
    pointer-events:none; z-index:999;
    font-size:28px; text-shadow:0 2px 8px rgba(0,0,0,0.5);
  }

  /* ===== STATS ROW ===== */
  .stats-row {
    display:grid; grid-template-columns:1fr 1fr;
    gap:8px; margin-bottom:16px;
  }
  .stat-card {
    background:rgba(0,0,0,0.3);
    border:1px solid var(--border);
    border-radius:12px; padding:12px 14px;
  }
  .stat-val { font-family:'Syne',sans-serif; font-size:22px; font-weight:700; }
  .stat-label { font-size:11px; color:var(--muted); margin-top:2px; }

  /* ===== TOAST ===== */
  .toast {
    position:fixed; top:24px; right:24px;
    padding:12px 18px; border-radius:12px;
    font-size:13px; font-weight:500;
    z-index:9999; display:none; align-items:center; gap:8px;
    box-shadow:0 10px 30px rgba(0,0,0,0.4);
    animation:toastIn 0.3s ease;
  }
  .toast.success { background:rgba(34,197,94,0.15);border:1px solid rgba(34,197,94,0.3);color:#4ADE80;display:flex; }
  .toast.error   { background:rgba(244,63,94,0.15); border:1px solid rgba(244,63,94,0.3); color:#FB7185;display:flex; }
  @keyframes toastIn { from{opacity:0;transform:translateX(20px)} to{opacity:1;transform:translateX(0)} }

  /* scrollbar */
  .owner-sidebar::-webkit-scrollbar { width:4px; }
  .owner-sidebar::-webkit-scrollbar-track { background:transparent; }
  .owner-sidebar::-webkit-scrollbar-thumb { background:var(--border); border-radius:4px; }
</style>
</head>
<body>

<!-- NAV -->
<nav class="nav">
  <div class="nav-logo">
    <div class="logo-icon">🏠</div>
    <div class="logo-text">NestGrid</div>
    <span style="margin-left:8px;padding:3px 10px;background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.25);border-radius:20px;font-size:11px;color:#F59E0B;">Owner Portal</span>
  </div>
  <div class="nav-right">
    <div class="nav-user" id="navUser">🏢 Owner</div>
    <button class="nav-btn" onclick="logout()">Logout</button>
  </div>
</nav>

<div class="main">
  <!-- SIDEBAR -->
  <div class="owner-sidebar">
    <div class="sidebar-tabs">
      <button class="stab active" onclick="switchStab('add')"     id="stabAdd">+ Add PG</button>
      <button class="stab"        onclick="switchStab('listings')" id="stabList">My Listings</button>
    </div>

    <!-- ===== ADD PG TAB ===== -->
    <div class="stab-content active" id="tabAdd">
      <div class="section-title">List a New Property</div>

      <div class="map-hint">
        📍 Click anywhere on the map to auto-fill coordinates
      </div>

      <div class="form-group">
        <label class="form-label">Property Name</label>
        <input class="form-input" id="pgName" placeholder="e.g. Sunrise PG, Elite Flat...">
      </div>

      <div class="two-col">
        <div class="form-group">
          <label class="form-label">Type</label>
          <select class="form-input" id="pgType">
            <option>PG</option>
            <option>Flat</option>
            <option>Hostel</option>
            <option>Studio</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Monthly Rent (₹)</label>
          <input class="form-input" id="pgPrice" type="number" placeholder="8000">
        </div>
      </div>

      <div class="two-col">
        <div class="form-group">
          <label class="form-label">Latitude</label>
          <input class="form-input" id="pgLat" type="number" placeholder="28.6100" step="0.0001">
        </div>
        <div class="form-group">
          <label class="form-label">Longitude</label>
          <input class="form-input" id="pgLng" type="number" placeholder="77.2000" step="0.0001">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Address / Locality</label>
        <input class="form-input" id="pgAddress" placeholder="e.g. Lajpat Nagar, New Delhi">
      </div>

      <div class="form-group">
        <label class="form-label">Rating (0–5)</label>
        <input class="form-input" id="pgRating" type="number" min="0" max="5" step="0.1" placeholder="4.2">
      </div>

      <div class="form-group">
        <label class="form-label">Description</label>
        <textarea class="form-input" id="pgDesc" rows="2" placeholder="Brief description..." style="resize:vertical"></textarea>
      </div>

      <!-- AMENITIES -->
      <div class="form-group">
        <label class="form-label">Nearby Amenities (select all that apply)</label>
        <div class="amenity-grid">
          <div class="amenity-toggle" data-type="Gym"      onclick="toggleAmenity(this)">
            <span class="a-icon">🏋️</span>Gym
          </div>
          <div class="amenity-toggle" data-type="Hospital" onclick="toggleAmenity(this)">
            <span class="a-icon">🏥</span>Hospital
          </div>
          <div class="amenity-toggle" data-type="Grocery"  onclick="toggleAmenity(this)">
            <span class="a-icon">🛒</span>Grocery
          </div>
          <div class="amenity-toggle" data-type="Metro"    onclick="toggleAmenity(this)">
            <span class="a-icon">🚇</span>Metro
          </div>
          <div class="amenity-toggle" data-type="Park"     onclick="toggleAmenity(this)">
            <span class="a-icon">🌳</span>Park
          </div>
          <div class="amenity-toggle" data-type="School"   onclick="toggleAmenity(this)">
            <span class="a-icon">🏫</span>School
          </div>
        </div>
      </div>

      <!-- AMENITY DISTANCES -->
      <div id="amenityDistances"></div>

      <button class="submit-btn" onclick="addListing()">🏠 Publish Listing</button>
    </div>

    <!-- ===== MY LISTINGS TAB ===== -->
    <div class="stab-content" id="tabListings">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
        <div class="section-title" style="margin:0">Your Properties</div>
      </div>

      <div class="stats-row" id="statsRow">
        <div class="stat-card">
          <div class="stat-val" id="statCount">0</div>
          <div class="stat-label">Total Listings</div>
        </div>
        <div class="stat-card">
          <div class="stat-val" id="statAvgPrice">—</div>
          <div class="stat-label">Avg. Rent/mo</div>
        </div>
      </div>

      <div id="myListings">
        <div class="empty-state">
          <div class="empty-icon">🏗️</div>
          No listings yet. Add your first property!
        </div>
      </div>
    </div>
  </div>

  <!-- MAP -->
  <div style="position:relative;flex:1;">
    <div id="ownerMap"></div>
    <div class="map-crosshair">📍</div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
// ===== SESSION =====
let currentUser = null;
try {
  currentUser = JSON.parse(sessionStorage.getItem('nestgrid_user') || '{}');
} catch(e) {}
if (!currentUser || currentUser.role !== 'owner') {
  // Allow demo access
  currentUser = { name: 'Demo Owner', email: 'owner@demo.com', role: 'owner' };
}
document.getElementById('navUser').textContent = '🏢 ' + (currentUser.name || 'Owner');

// ===== MAP =====
const map = L.map('ownerMap').setView([28.61, 77.20], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap'
}).addTo(map);

// Click to set lat/lng
map.on('click', e => {
  document.getElementById('pgLat').value = e.latlng.lat.toFixed(5);
  document.getElementById('pgLng').value = e.latlng.lng.toFixed(5);
  showToast('Coordinates set from map click ✓');
});

// ===== STATE =====
let myListings = JSON.parse(localStorage.getItem('nestgrid_listings') || '[]');
let mapMarkers = [];
let selectedAmenities = new Set();
let editingId = null;

// ===== RENDER ALL MARKERS =====
function renderMapMarkers() {
  mapMarkers.forEach(m => map.removeLayer(m));
  mapMarkers = [];
  myListings.forEach(pg => {
    const m = L.marker([pg.lat, pg.lng])
      .addTo(map)
      .bindPopup(`<b>${pg.name}</b><br>₹${pg.price}/mo<br>⭐ ${pg.rating}`);
    mapMarkers.push(m);
  });
}

// ===== AMENITIES TOGGLE =====
function toggleAmenity(el) {
  const type = el.dataset.type;
  el.classList.toggle('selected');
  if (selectedAmenities.has(type)) {
    selectedAmenities.delete(type);
  } else {
    selectedAmenities.add(type);
  }
  renderAmenityDistances();
}

function renderAmenityDistances() {
  const container = document.getElementById('amenityDistances');
  if (selectedAmenities.size === 0) { container.innerHTML=''; return; }

  container.innerHTML = `
    <div class="form-group">
      <label class="form-label">Distance to each amenity (km)</label>
      ${[...selectedAmenities].map(type => `
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
          <span style="font-size:14px">${getAmenityIcon(type)}</span>
          <span style="font-size:12px;width:70px;color:var(--muted)">${type}</span>
          <input class="form-input" id="dist_${type}" type="number" 
            placeholder="km" step="0.1" min="0" style="flex:1;padding:7px 10px">
        </div>
      `).join('')}
    </div>
  `;
}

function getAmenityIcon(t) {
  return {Gym:'🏋️',Hospital:'🏥',Grocery:'🛒',Metro:'🚇',Park:'🌳',School:'🏫'}[t] || '📍';
}

// ===== ADD / UPDATE LISTING =====
function addListing() {
  const name    = document.getElementById('pgName').value.trim();
  const type    = document.getElementById('pgType').value;
  const price   = +document.getElementById('pgPrice').value;
  const lat     = +document.getElementById('pgLat').value;
  const lng     = +document.getElementById('pgLng').value;
  const address = document.getElementById('pgAddress').value.trim();
  const rating  = +document.getElementById('pgRating').value || 4.0;
  const desc    = document.getElementById('pgDesc').value.trim();

  if (!name || !price || !lat || !lng) {
    return showToast('Name, price, lat & lng are required', 'error');
  }

  const amenities = [...selectedAmenities].map(type => ({
    type,
    d: +document.getElementById(`dist_${type}`)?.value || 0.5,
    lat, lng
  }));

  const pg = {
    id: editingId || Date.now(),
    name, type, price, lat, lng, address, rating, desc,
    amenities,
    nearby: amenities,
    owner: currentUser.email
  };

  if (editingId) {
    const idx = myListings.findIndex(p => p.id === editingId);
    if (idx !== -1) myListings[idx] = pg;
    editingId = null;
  } else {
    myListings.push(pg);
  }

  // Merge into global pgs for main app
  let globalPgs = JSON.parse(localStorage.getItem('nestgrid_global_pgs') || '[]');
  const gIdx = globalPgs.findIndex(p => p.id === pg.id);
  if (gIdx !== -1) globalPgs[gIdx] = pg; else globalPgs.push(pg);
  localStorage.setItem('nestgrid_global_pgs', JSON.stringify(globalPgs));
  localStorage.setItem('nestgrid_listings', JSON.stringify(myListings));

  clearForm();
  renderListings();
  renderMapMarkers();
  showToast(`"${name}" published successfully! 🎉`);

  // Switch to listings tab
  setTimeout(() => switchStab('listings'), 1200);
}

// ===== CLEAR FORM =====
function clearForm() {
  ['pgName','pgPrice','pgLat','pgLng','pgAddress','pgDesc'].forEach(id => {
    document.getElementById(id).value = '';
  });
  document.getElementById('pgRating').value = '';
  document.getElementById('pgType').value = 'PG';
  selectedAmenities.clear();
  document.querySelectorAll('.amenity-toggle').forEach(el => el.classList.remove('selected'));
  document.getElementById('amenityDistances').innerHTML = '';
  editingId = null;
}

// ===== DELETE =====
function deleteListing(id) {
  if (!confirm('Remove this listing?')) return;
  myListings = myListings.filter(p => p.id !== id);
  let globalPgs = JSON.parse(localStorage.getItem('nestgrid_global_pgs') || '[]');
  globalPgs = globalPgs.filter(p => p.id !== id);
  localStorage.setItem('nestgrid_global_pgs', JSON.stringify(globalPgs));
  localStorage.setItem('nestgrid_listings', JSON.stringify(myListings));
  renderListings();
  renderMapMarkers();
  showToast('Listing removed');
}

// ===== EDIT =====
function editListing(id) {
  const pg = myListings.find(p => p.id === id);
  if (!pg) return;
  editingId = id;

  document.getElementById('pgName').value    = pg.name;
  document.getElementById('pgType').value    = pg.type;
  document.getElementById('pgPrice').value   = pg.price;
  document.getElementById('pgLat').value     = pg.lat;
  document.getElementById('pgLng').value     = pg.lng;
  document.getElementById('pgAddress').value = pg.address || '';
  document.getElementById('pgRating').value  = pg.rating;
  document.getElementById('pgDesc').value    = pg.desc || '';

  selectedAmenities.clear();
  document.querySelectorAll('.amenity-toggle').forEach(el => el.classList.remove('selected'));
  (pg.amenities || []).forEach(a => {
    selectedAmenities.add(a.type);
    const el = document.querySelector(`.amenity-toggle[data-type="${a.type}"]`);
    if (el) el.classList.add('selected');
  });
  renderAmenityDistances();
  (pg.amenities || []).forEach(a => {
    const inp = document.getElementById(`dist_${a.type}`);
    if (inp) inp.value = a.d;
  });

  switchStab('add');
  map.setView([pg.lat, pg.lng], 14);
  showToast(`Editing "${pg.name}"`,'success');
}

// ===== RENDER LISTINGS =====
function renderListings() {
  const container = document.getElementById('myListings');
  const filtered  = myListings.filter(p => p.owner === currentUser.email || !p.owner);

  document.getElementById('statCount').textContent = filtered.length;
  if (filtered.length) {
    const avg = Math.round(filtered.reduce((s,p)=>s+p.price,0)/filtered.length);
    document.getElementById('statAvgPrice').textContent = '₹'+avg.toLocaleString();
  }

  if (!filtered.length) {
    container.innerHTML = `<div class="empty-state"><div class="empty-icon">🏗️</div>No listings yet. Add your first property!</div>`;
    return;
  }

  container.innerHTML = filtered.map(pg => `
    <div class="listing-card">
      <div class="lc-title">${pg.name}</div>
      <div class="lc-meta">${pg.type} • ${pg.address || 'No address'} • ⭐ ${pg.rating}</div>
      <div class="lc-price">₹${pg.price.toLocaleString()}/mo</div>
      <div class="lc-amenities">
        ${(pg.amenities||[]).map(a=>`<span class="amenity-pill">${getAmenityIcon(a.type)} ${a.type} ${a.d}km</span>`).join('')}
      </div>
      <div class="lc-actions">
        <button class="action-btn edit" onclick="editListing(${pg.id})">✏️ Edit</button>
        <button class="action-btn del"  onclick="deleteListing(${pg.id})">🗑 Delete</button>
      </div>
    </div>
  `).join('');
}

// ===== STAB SWITCH =====
function switchStab(tab) {
  document.getElementById('stabAdd').classList.toggle('active',  tab==='add');
  document.getElementById('stabList').classList.toggle('active', tab==='listings');
  document.getElementById('tabAdd').classList.toggle('active',      tab==='add');
  document.getElementById('tabListings').classList.toggle('active', tab==='listings');
  if (tab==='listings') renderListings();
}

// ===== TOAST =====
function showToast(msg, type='success') {
  const t = document.getElementById('toast');
  t.className = `toast ${type}`;
  t.innerHTML = (type==='success'?'✅':'❌') + ' ' + msg;
  t.style.display = 'flex';
  setTimeout(()=>{ t.style.display='none'; }, 3000);
}

// ===== LOGOUT =====
function logout() {
  sessionStorage.removeItem('nestgrid_user');
  window.location.href = 'auth.html';
}

// ===== INIT =====
renderListings();
renderMapMarkers();
</script>
</body>
